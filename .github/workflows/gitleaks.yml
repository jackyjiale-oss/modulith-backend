name: gitleaks

# Secret scan with the gitleaks CLI (MIT), not the official gitleaks-action: the Action asks for a paid licence key on
# organisation accounts, and the CLI needs none (design D10). The release is pinned by version and by the SHA-256 of the
# linux x64 archive (from the release's own checksums file). Dependabot does not see them, so raise both by hand
# (a release at least two weeks old, licence checked again).
# Rules: the defaults plus .gitleaks.toml, which allowlists only dummy values in test fixtures.
# A pull request scans its own commits; a push to main and the weekly run scan the whole history, every branch included.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: the pull request range below needs the base branch, and a shallow checkout would also hide older commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      # --redact: a finding never prints the secret. The base branch name reaches the script only through env.
      # gitleaks exits 0 when git cannot resolve the range (it only logs an error), so the base ref is checked first.
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--config .gitleaks.toml --no-banner --redact --exit-code 1)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" > /dev/null; then
              echo "::error title=gitleaks::origin/${BASE_REF} is not in the checkout, so the pull request range cannot be scanned."
              exit 1
            fi
            args+=("--log-opts=origin/${BASE_REF}..HEAD")
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git "${args[@]}" .
