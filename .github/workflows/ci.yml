name: CI

# Actions use their latest major tag so Dependabot can update them.
# Production forks should pin each action to a full commit SHA (with the tag in a comment).

# The pull request title check (commit-lint) lives in pr-title.yml, so editing a title does not re-run this pipeline.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  # cd.yml calls this workflow, so what it deploys has passed the same jobs (design D4).
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The coverage comment and the test-report check run need write access; no other job gets it.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      # Full history, so the base branch's OpenAPI snapshot is there for the breaking-change gate (the token is not kept to fetch it later).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked mode; NuGet Audit fails here)
        run: dotnet restore --locked-mode

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Breaking-change gate (OpenApiBaselineTests, docs/api-compatibility.md), pull requests only: the base branch's OpenAPI snapshot
      # is the baseline, and a `!` in the title (feat(api)!: ...) accepts an intended break. Editing the title does not re-run this
      # workflow, so push again after adding the `!`. The title reaches the script only through env, never interpolated into it.
      - name: OpenAPI baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          baseline="$RUNNER_TEMP/openapi-baseline.json"
          # Must match the snapshot path of OpenApiSnapshotTests and ApiVersionRegisterTests (and OpenApiCompatibilityTests).
          snapshot="tests/TemplateName.IntegrationTests/Documentation/OpenApiSnapshotTests.OpenApi_document_matches_snapshot.verified.json"
          if git show "origin/$BASE_REF:$snapshot" > "$baseline"; then
            echo "OPENAPI_BASELINE=$baseline" >> "$GITHUB_ENV"
          else
            echo "::warning title=OpenAPI baseline::The base branch has no OpenAPI snapshot, so the breaking-change gate is skipped."
          fi
          if printf '%s' "$PR_TITLE" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            echo "API_BREAKING_ACCEPTED=true" >> "$GITHUB_ENV"
          fi

      # Unit, architecture and integration tests (Testcontainers uses the runner's Docker).
      # Coverage scope lives in coverage.testconfig.json; TRX reports feed the test reporter.
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --config-file coverage.testconfig.json --coverlet
          --report-xunit-trx
          --results-directory TestResults

      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:TestResults/**/*.cobertura.*.xml" "-targetdir:coverage" "-reporttypes:MarkdownSummaryGithub;JsonSummary"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate (80 % line)
        run: |
          line="$(jq -r '.summary.linecoverage' coverage/Summary.json)"
          echo "Line coverage on the gated namespaces: ${line} %"
          if ! awk -v value="$line" 'BEGIN { exit !(value + 0 >= 80) }'; then
            echo "::error title=Coverage gate::Line coverage ${line} % is below 80 %"
            exit 1
          fi

      # Fork and Dependabot pull requests get a read-only token, so the comment and check run are skipped for them.
      - name: Coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && hashFiles('coverage/SummaryGithub.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage/SummaryGithub.md

      - name: Test report
        if: ${{ always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  template-smoke:
    name: template-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Projects generated from the template have no .template.config, so the step is skipped there.
      - name: Template smoke test
        if: ${{ hashFiles('.template.config/template.json') != '' }}
        run: bash build/scripts/template-smoke.sh

  # Every NuGet package, transitive ones included, must have an allowed licence (build/licenses/README.md).
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # The licence tool reads the restored package graph (project.assets.json), so restore first.
      - name: Restore (locked mode)
        run: |
          dotnet restore --locked-mode
          dotnet tool restore

      - name: Check dependency licences
        run: >-
          dotnet nuget-license -i TemplateName.slnx -t
          -a build/licenses/allowed-licenses.json
          -mapping build/licenses/license-url-mappings.json
          -override build/licenses/package-overrides.json
          -ignore build/licenses/ignored-packages.json
          -err

  # The API image (build/docker/Dockerfile), checked by build/scripts/container-verify.sh: migrate twice against a throwaway SQL Server,
  # start in Production, the image's HEALTHCHECK reports healthy, /health/ready answers 200, the user is not root. cd.yml runs the same
  # script on the pushed digest. Runs in parallel with build-test.
  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # context: . builds the checked-out files (the action's default is its own Git checkout); load puts the image in the runner's
      # Docker for the script. The layers are cached in the GitHub Actions cache between runs.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/docker/Dockerfile
          tags: api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image
        run: bash build/scripts/container-verify.sh api:ci

  # The IIS deploy script (build/scripts/deploy-iis.ps1, design section 8): its Pester tests, with the IIS and file calls mocked, and
  # PSScriptAnalyzer. PowerShell 7 on the Ubuntu runner; the script itself also has to run on Windows PowerShell 5.1 (the IIS server).
  # Pester and PSScriptAnalyzer are MIT licensed. The versions are pinned; Dependabot does not see them, so raise them by hand
  # (a release at least two weeks old).
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      # The runner image ships an older Pester, so import the pinned one explicitly.
      - name: Pester
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.9.1
          Invoke-Pester -Path build/scripts/tests -CI

      # Contract-migration detection and mode resolution (maintenance screen design, sections 5 and 6); each case builds a throwaway git repository.
      - name: Maintenance scripts
        run: bash build/scripts/tests/maintenance-scripts.test.sh

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          Invoke-ScriptAnalyzer -Path build/scripts -Recurse -Severity Warning,Error -EnableExit

  # Every workflow file: syntax, expressions, the job graph and the shell of each `run` (shellcheck ships in the image).
  # The image tag is pinned (rhysd/actionlint, MIT); Dependabot does not see a tag in a `run`, so raise it by hand.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
