name: Template matrix

# Template-repository-only: .template.config/template.json leaves this file out of generated projects.
# Generates the template with each combination of the three switches (notifications, includeSample, caching) and runs the
# smoke test with its integration tests and the quality gates of the generated project's CI (formatting, 80 % line coverage, licences),
# so a project that turns a switch off still builds and passes (switches design, section 5).
# The `module-template` job generates the project, adds a module to it with the `modulith-module` item template (a single-word and a
# multi-word name, with and without a .Contracts project) and runs the same smoke test and gates on the result.
# The `package-smoke` job packs the checkout, installs the package and compares the project it generates with the checkout's own output
# (all switches on, and all off); it publishes nothing.
# The all-on `template-smoke` job in ci.yml stays the fast required check; the `all-on` leg here is additional.
# Actions use their latest major tag so Dependabot can update them.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# Only a pull request cancels its own earlier run. A push to main keeps running, so the post-merge pair combinations are never lost
# to the next merge (the same rule as codeql.yml and gitleaks.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The five single-switch and all-switch combinations, on every pull request, push to main and manual run.
  template-matrix:
    name: template-matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-on
            switches: ""
          - name: all-off
            switches: "--notifications false --includeSample false --caching memory"
          - name: no-notifications
            switches: "--notifications false"
          - name: no-sample
            switches: "--includeSample false"
          - name: memory-cache
            switches: "--caching memory"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The switches reach the script only through env, never interpolated into it; an empty string means the defaults.
      - name: Template smoke test (${{ matrix.name }})
        env:
          SWITCHES: ${{ matrix.switches }}
        run: |
          read -r -a args <<< "$SWITCHES"
          bash build/scripts/template-smoke.sh --integration --gates "${args[@]}"

  # The pair combinations, which take the longest to find a problem and so run only after merge or on demand.
  template-matrix-pairs:
    name: template-matrix-pairs (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-notifications-memory
            switches: "--notifications false --caching memory"
          - name: no-notifications-no-sample
            switches: "--notifications false --includeSample false"
          - name: no-sample-memory
            switches: "--includeSample false --caching memory"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Template smoke test (${{ matrix.name }})
        env:
          SWITCHES: ${{ matrix.switches }}
        run: |
          read -r -a args <<< "$SWITCHES"
          bash build/scripts/template-smoke.sh --integration --gates "${args[@]}"

  # The module item template: a project generated with the switches, then one module added to it, on every pull request, push to main and
  # manual run. The switches and the module arguments reach the script only through env.
  module-template:
    name: module-template (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-on-contracts
            switches: ""
            module_args: "--add-module Billing --module-contracts"
          - name: all-off-multiword
            switches: "--notifications false --includeSample false --caching memory"
            module_args: "--add-module LeaveManagement"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Template smoke test with a module (${{ matrix.name }})
        env:
          SWITCHES: ${{ matrix.switches }}
          MODULE_ARGS: ${{ matrix.module_args }}
        run: |
          read -r -a switch_args <<< "$SWITCHES"
          read -r -a module_args <<< "$MODULE_ARGS"
          args=("${switch_args[@]}" "${module_args[@]}")
          bash build/scripts/template-smoke.sh --integration --gates "${args[@]}"

  # The template package: the checkout packed, installed and used to generate a project that must match the checkout's own output, on
  # every pull request, push to main and manual run. Nothing is published. The switches reach the script only through env.
  package-smoke:
    name: package-smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-on
            switches: ""
          - name: all-off
            switches: "--notifications false --includeSample false --caching memory"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Template package smoke test (${{ matrix.name }})
        env:
          SWITCHES: ${{ matrix.switches }}
        run: |
          read -r -a args <<< "$SWITCHES"
          bash build/scripts/template-smoke.sh --from-package --generate-only "${args[@]}"
