name: CodeQL

# CodeQL is free for public repositories and needs GitHub Advanced Security on private ones.
# Set the repository variable CODEQL_ENABLED to false to turn it off (design D9); the job is then skipped,
# and a skipped job satisfies a required check, so the `codeql` check can stay in the required list.
# The first run on a repository may report that code scanning is not enabled: allow it under Settings > Advanced Security.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: codeql
    if: ${{ vars.CODEQL_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      # CodeQL reads the workflow run on private repositories.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # manual: the build below is what CodeQL traces, so it must compile every project (tests included).
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
